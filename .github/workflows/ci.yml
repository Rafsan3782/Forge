name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'templates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            typescript:
              - 'packages/**'
              - 'apps/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
  rust:
    name: Rust (Check, Lint & Test)
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy lint
        run: cargo clippy --workspace -- -D warnings

      - name: Rust nextest
        run: cargo nextest run

      - name: Generate headless screenshot
        run: cargo run -p forge_runtime -- --headless --frames 5 --screenshot hello_screenshot.png --scene templates/hello/scene.json

      - name: Upload headless screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-screenshot
          path: hello_screenshot.png
          if-no-files-found: warn

      - name: Generate tilemap headless screenshot
        run: cargo run -p forge_runtime -- --headless --frames 5 --screenshot tilemap_screenshot.png --scene templates/tilemap-demo/scene.json

      - name: Upload tilemap screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tilemap-screenshot
          path: tilemap_screenshot.png
          if-no-files-found: warn

  typescript:
    name: TypeScript (Lint, Typecheck & Test)
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.typescript == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen is up to date
        shell: bash
        run: |
          pnpm run codegen
          git diff --exit-code

      - name: TypeScript lint
        run: pnpm -r lint

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript test
        run: pnpm -r test

      - name: Build Studio frontend
        run: pnpm --filter studio build

  ci:
    name: CI Status (Aggregator)
    needs: [changes, rust, typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required workflow results
        run: |
          rust_res="${{ needs.rust.result }}"
          ts_res="${{ needs.typescript.result }}"

          if [ "$rust_res" = "failure" ] || [ "$rust_res" = "cancelled" ] || [ "$ts_res" = "failure" ] || [ "$ts_res" = "cancelled" ]; then
            echo "::error::One or more upstream CI jobs failed (Rust: $rust_res, TypeScript: $ts_res)."
            exit 1
          fi
          echo "All required CI jobs completed successfully (Rust: $rust_res, TypeScript: $ts_res)."
