name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Check, Lint & Test)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy lint
        run: cargo clippy --workspace -- -D warnings

      - name: Rust nextest
        run: cargo nextest run

      - name: Generate headless screenshot
        run: cargo run -p forge_runtime -- --headless --frames 5 --screenshot hello_screenshot.png --scene templates/hello/scene.json

      - name: Upload headless screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-screenshot
          path: hello_screenshot.png
          if-no-files-found: warn

  typescript:
    name: TypeScript (Lint, Typecheck & Test)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen is up to date
        shell: bash
        run: |
          pnpm run codegen
          git diff --exit-code

      - name: TypeScript lint
        run: pnpm -r lint

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript test
        run: pnpm -r test

      - name: Build Studio frontend
        run: pnpm --filter studio build

  ci:
    name: CI Status (Aggregator)
    needs: [rust, typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required workflow results
        run: |
          if [ "${{ needs.rust.result }}" != "success" ] || [ "${{ needs.typescript.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed (Rust: ${{ needs.rust.result }}, TypeScript: ${{ needs.typescript.result }})."
            exit 1
          fi
          echo "All upstream CI jobs completed successfully."
