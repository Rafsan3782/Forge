name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs (Generate, Validate & Package)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation generator & build
        run: pnpm docs:build

      - name: Freshness check (verify generated reference pages match Git)
        shell: bash
        run: |
          git diff --exit-code docs/src/reference/
          if [ $? -ne 0 ]; then
            echo "::error::Reference docs are out of date with protocol. Run 'pnpm docs:build' and commit the changes."
            exit 1
          fi

      - name: Validate quality gates (schemas, broken links, style, agent pack sizes)
        run: pnpm docs:validate

      - name: Run documentation test suite
        run: pnpm docs:test

      - name: Upload docs distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/
          if-no-files-found: error
