[workspace]
resolver = "2"
members = [
    "crates/forge_core",
    "crates/forge_render",
    "crates/forge_physics",
    "crates/forge_audio",
    "crates/forge_assets",
    "crates/forge_input",
    "crates/forge_script",
    "crates/forge_bridge",
    "crates/forge_protocol",
    "crates/forge_playtest",
    "crates/forge_runtime",
    "crates/forge_cli",
]
exclude = [
    "apps/studio/src-tauri",
]

[profile.dev]
# Faster linking and reduced IO by writing line tables only
debug = 1
codegen-units = 16

[profile.test]
debug = 1
codegen-units = 16


