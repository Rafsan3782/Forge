[workspace]

[package]
name = "studio"
version = "0.1.0"
description = "Forge Studio IDE Desktop Application"
authors = ["Forge Engine Authors"]
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
vswhom-sys = { path = "../../../tools/vswhom-sys-stub" }
