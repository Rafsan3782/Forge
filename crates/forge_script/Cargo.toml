[package]
name = "forge_script"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs = { version = "0.15", default-features = false }
forge_assets = { path = "../forge_assets" }
forge_core = { path = "../forge_core" }
forge_input = { path = "../forge_input" }
forge_physics = { path = "../forge_physics" }
forge_audio = { path = "../forge_audio" }
forge_protocol = { path = "../forge_protocol" }
rquickjs = { version = "0.14", features = ["classes", "properties"] }
swc = "80.0"
swc_common = { version = "26.0", features = ["sourcemap"] }
sourcemap = "9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
