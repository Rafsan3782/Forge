[package]
name = "forge_audio"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs = { version = "0.15", default-features = false }
forge_assets = { path = "../forge_assets" }
forge_core = { path = "../forge_core" }
forge_protocol = { path = "../forge_protocol" }
kira = { version = "0.12", features = ["cpal", "wav", "ogg", "mp3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

