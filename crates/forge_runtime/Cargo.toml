[package]
name = "forge_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bevy_ecs = { version = "0.15", default-features = false }
clap = { version = "4.5", features = ["derive"] }
forge_assets = { path = "../forge_assets" }
forge_bridge = { path = "../forge_bridge" }
forge_core = { path = "../forge_core" }
forge_input = { path = "../forge_input" }
forge_physics = { path = "../forge_physics" }
forge_protocol = { path = "../forge_protocol" }
forge_render = { path = "../forge_render" }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wgpu = "24"
winit = { version = "0.30", features = ["rwh_06"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
