[package]
name = "forge_physics"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs = { version = "0.15", default-features = false }
forge_core = { path = "../forge_core" }
forge_protocol = { path = "../forge_protocol" }
nalgebra = "0.33"
rapier2d = { version = "0.22", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
